version: "3.9" # docker compose file format

services:
  # backend service (Hono + Bun)
  backend:
    build: ./server # path to Dockerfile for backend
    restart: always
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY} # TMDB_API_KEY
      SUPABASE_URL: ${SUPABASE_URL} # Supabase URL
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY} # Supabase Service Role Key
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      ENVIRONMENT: ${ENVIRONMENT} # dev or prod environment
    expose:
      - "3000" # exposing backend port
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # frontend service (Vite + React served by nginx)
  frontend:
    build:
      context: ./client
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL} # pass build arg here
    restart: always
    depends_on:
      - backend
    expose:
      - "80" # exposing container port 80
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
